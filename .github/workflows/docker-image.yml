name: Docker image

on:
  push:
    branches: ["main", "python-port", "docker/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Lint every script by shebang (shellcheck, Python 3.9)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          python --version
          python scripts/lint-scripts

      - name: Black-box tests for the host scripts
        run: python -m unittest discover -s tests/host -v

      - name: Validate the compose configuration
        run: docker compose config --quiet

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: ROS apt package versions are pinned by the base image digest
          # and the ROS distribution, not per package.
          ignore: DL3008

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ci-annotate re-prints any FAIL lines as annotations, which are readable
      # on the pull request without signing in; job logs are not.
      - name: Build and run the smoke tests
        run: ./scripts/ci-annotate smoke -- ./scripts/smoke-container

  # Second architecture: build only.  GitHub's arm64 runners cannot run the
  # graphical smoke tests reliably, so this guards the package availability
  # that Apple Silicon depends on.
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ros2-tutorials:arm64-ci

      - name: Headless ROS checks
        run: |
          docker run --rm ros2-tutorials:arm64-ci bash -lc '
            set -e
            ros2 pkg executables turtlesim | grep turtlesim_node
            ros2 pkg executables turtlesim | grep turtle_teleop_key
            command -v colcon
            command -v rosdep
            [ "$(id -u)" -ne 0 ]
          '

  # Podman is a supported fallback, not the documented default, so a failure
  # here reports a regression without blocking the branch.
  smoke-podman:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman
          pip install --user -r requirements-host.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          podman version

      - name: Report host readiness
        run: ./scripts/check-host

      - name: Smoke tests under Podman
        env:
          COMPOSE: podman-compose
        run: ./scripts/ci-annotate smoke-podman -- ./scripts/smoke-container

  scan:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker compose build

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ros2-tutorials:lyrical
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
