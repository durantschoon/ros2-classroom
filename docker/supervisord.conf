; Browser desktop for the ROS tutorial workstation.
;
; supervisord runs as root so it can write its own socket and logs; every
; graphical program runs as the unprivileged workstation user.  x11vnc listens
; on loopback inside the container, so noVNC/websockify is the only way in.

[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -ac
user=%(ENV_USER_NAME)s
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox --startup /etc/xdg/openbox/autostart
user=%(ENV_USER_NAME)s
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USER_NAME)s",USER="%(ENV_USER_NAME)s"
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/bash -c 'exec /usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbport %(ENV_VNC_PORT)s -localhost -forever -shared -noxdamage -repeat $( [ -n "${VNC_PASSWORD}" ] && echo "-passwd ${VNC_PASSWORD}" || echo "-nopw" )'
user=%(ENV_USER_NAME)s
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USER_NAME)s",VNC_PASSWORD="%(ENV_VNC_PASSWORD)s"
autorestart=true
priority=30
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s
user=%(ENV_USER_NAME)s
autorestart=true
priority=40
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
